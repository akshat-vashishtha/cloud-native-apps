server:
  port: 8083
  shutdown: graceful

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9000}
  application:
    name: chat-communication-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${CHAT_MONGODB_URI:mongodb://localhost:27017/chat_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${app.kafka.consumer.group-id}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    topics:
      chat-events: ${KAFKA_TOPIC_CHAT_EVENTS:chat.events.v1}
      transactions: ${KAFKA_TOPIC_TRANSACTIONS:banking.transactions.v1}
      ai-stream: ${KAFKA_TOPIC_AI_STREAM:ai.stream.v1}
      ai-confirmations: ${KAFKA_TOPIC_AI_CONFIRMATIONS:ai.confirmations.v1}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:chat-notification-group}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
