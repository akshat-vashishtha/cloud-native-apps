server:
  port: 8084
  shutdown: graceful

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9000}
  application:
    name: kpi-analytics-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${KPI_MONGODB_URI:mongodb://localhost:27017/kpi_analytics_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${app.kafka.consumer.group-id}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    topics:
      transactions: ${KAFKA_TOPIC_TRANSACTIONS:banking.transactions.v1}
      chat-events: ${KAFKA_TOPIC_CHAT_EVENTS:chat.events.v1}
      fraud-alerts: ${KAFKA_TOPIC_FRAUD_ALERTS:fraud.alerts.v1}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:kpi-analytics-group}
    velocity:
      window-minutes: ${VELOCITY_WINDOW_MINUTES:5}
      threshold: ${VELOCITY_THRESHOLD:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
