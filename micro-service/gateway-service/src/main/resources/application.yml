server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ["http://localhost:3000", "http://localhost:5173"]
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: user-service-route
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: banking-service-route
          uri: ${BANKING_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/banking/**
        - id: kpi-service-route
          uri: ${KPI_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/kpi/**
        - id: chat-websocket-route
          uri: ${CHAT_SERVICE_URI:ws://localhost:8083}
          predicates:
            - Path=/ws/**
        - id: chat-service-rest-route
          uri: ${CHAT_SERVICE_HTTP_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/chat/**

app:
  security:
    internal-hmac-secret: ${INTERNAL_HMAC_SECRET:d4e7b8c29f1a4e6d8a3b5c7e9f0123456789abcdef0123456789abcdef012345}
    user-service-uri: ${USER_SERVICE_URI:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
