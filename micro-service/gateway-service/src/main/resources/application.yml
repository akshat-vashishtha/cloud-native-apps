server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: 8h
    redis:
      namespace: gateway:session
  security:
    oauth2:
      client:
        provider:
          local-as:
            issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9000}
        registration:
          gateway-client:
            provider: local-as
            client-id: ${OAUTH2_GATEWAY_CLIENT_ID:gateway-client}
            client-secret: ${OAUTH2_GATEWAY_CLIENT_SECRET:gateway-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,api.read
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ["http://localhost:3000"]
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      default-filters:
        - TokenRelay=
      routes:
        - id: user-service-route
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/roles/**
        - id: banking-service-route
          uri: ${BANKING_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/banking/**
        - id: kpi-service-route
          uri: ${KPI_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/kpi/**
        - id: chat-websocket-route
          uri: ${CHAT_SERVICE_URI:ws://localhost:8083}
          predicates:
            - Path=/ws/**
        - id: chat-service-rest-route
          uri: ${CHAT_SERVICE_HTTP_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/chat/**
        - id: intelligence-ai-service-route
          uri: ${AI_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/ai/**

app:
  web-base-url: ${WEB_BASE_URL:http://localhost:3000}
  session-cookie-name: APP_SESSION

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
