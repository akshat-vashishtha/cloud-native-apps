syntax = "proto3";

package banking.v1;

option java_multiple_files = true;
option java_package = "com.learning.banking.grpc.v1";

service BankingGrpcService {
  rpc GetAccountBalance (GetBalanceRequest) returns (GetBalanceResponse);
  rpc TransferFunds (TransferFundsRequest) returns (TransferFundsResponse);
  rpc UpdateCardStatus (UpdateCardRequest) returns (UpdateCardResponse);
}

message GetBalanceRequest {
  string account_id = 1;
  string user_id = 2;
}

message GetBalanceResponse {
  string account_id = 1;
  double balance = 2;
  string currency = 3;
  string status = 4;
}

message TransferFundsRequest {
  string source_account_id = 1;
  string target_account_id = 2;
  double amount = 3;
  string currency = 4;
  string user_id = 5;
  string description = 6;
}

message TransferFundsResponse {
  string transaction_id = 1;
  string status = 2;
  string message = 3;
}

message UpdateCardRequest {
  string card_id = 1;
  string status = 2;
  string user_id = 3;
}

message UpdateCardResponse {
  string card_id = 1;
  string status = 2;
}
